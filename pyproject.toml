[project]
name = "promap"
version = "0.1.0"
description = "Projection mapping editor and live show runner"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "moderngl>=5.10",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10",
    "panda3d>=1.10.14",
    "sounddevice>=0.5",
    "av>=13",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
promap = "promap.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
